[project]
name = "qwen-vllm"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "huggingface-hub[hf-xet]>=2.2.0",
    "vllm==0.32.0",
]

[tool.uv]
python-preference = "only-managed"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# Match the JIT toolchain to the CUDA 13.0 runtime torch is built against
# (vllm[cu13] otherwise pulls nvcc 13.4, whose headers clash with 13.0).
override-dependencies = [
    "nvidia-cuda-nvcc==13.0.88",
    "nvidia-cuda-crt==13.0.88",
    "nvidia-nvvm==13.0.88",
]

[dependency-groups]
dev = [
    "pyarrow>=26.0.0",
]
